<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gaming News - GAMINX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0a0a0a;
    color:white;
}

nav{
    background:#111;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#00d4ff;
}

.back{
    text-decoration:none;
    background:#00d4ff;
    color:#000;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    padding:50px 8%;
    max-width:1400px;
    margin:auto;
}

.title{
    font-size:38px;
    margin-bottom:10px;
}

.subtitle{
    color:#999;
    margin-bottom:35px;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.news-card{
    background:#151515;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.news-card:hover{
    transform:translateY(-5px);
}

.news-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.news-content{
    padding:20px;
}

.news-content h2{
    font-size:19px;
    margin-bottom:12px;
    line-height:1.4;
}

.news-content p{
    color:#999;
    font-size:14px;
    margin-bottom:15px;
}

.news-content a{
    color:#00d4ff;
    text-decoration:none;
    font-weight:bold;
}

.loading{
    text-align:center;
    font-size:20px;
    color:#00d4ff;
    padding:50px;
}

.error{
    text-align:center;
    color:#ff5555;
    padding:30px;
}
</style>
</head>

<body>

<nav>
    <div class="logo">GAMIN<span>X</span></div>
    <a href="index.html" class="back">← Home</a>
</nav>

<div class="container">

    <h1 class="title">Latest Gaming News</h1>
    <p class="subtitle">Stay updated with the latest news from the gaming world.</p>

    <div id="news" class="news-grid">
        <div class="loading">Loading latest gaming news...</div>
    </div>

</div>

<script>

async function loadNews() {

    const newsContainer = document.getElementById("news");

    try {

        const response = await fetch(
            "https://api.rss2json.com/v1/api.json?rss_url=https://www.gamespot.com/feeds/mashup/"
        );

        const data = await response.json();

        newsContainer.innerHTML = "";

        data.items.slice(0, 12).forEach(article => {

            let image = "";

            /* First try thumbnail */
            if (article.thumbnail && article.thumbnail.trim() !== "") {
                image = article.thumbnail;
            }

            /* Try finding image inside article description */
            if (!image && article.description) {
                const imgMatch = article.description.match(/<img[^>]+src=["']([^"']+)["']/);

                if (imgMatch && imgMatch[1]) {
                    image = imgMatch[1];
                }
            }

            /* Default gaming image */
            if (!image) {
                image = "https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800";
            }

            const card = document.createElement("div");

            card.className = "news-card";

            card.innerHTML = `
                <img src="${image}" alt="Gaming News"
                onerror="this.src='https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800'">

                <div class="news-content">
                    <h2>${article.title}</h2>

                    <p>${new Date(article.pubDate).toLocaleDateString()}</p>

                    <a href="${article.link}" target="_blank">
                        Read Full Article →
                    </a>
                </div>
            `;

            newsContainer.appendChild(card);

        });

    } catch (error) {

        newsContainer.innerHTML =
        `<div class="error">
        Unable to load news. Please check your internet connection.
        </div>`;

    }

}

loadNews();

</script>

</body>
</html>
