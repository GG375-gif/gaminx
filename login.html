<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - GAMINX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0a0a0a;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:90%;
    max-width:400px;
    background:#151515;
    padding:35px;
    border-radius:15px;
}

.logo{
    text-align:center;
    font-size:32px;
    margin-bottom:25px;
}

.logo span{
    color:#00d4ff;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:6px;
    background:#222;
    color:white;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:6px;
    background:#00d4ff;
    font-weight:bold;
    cursor:pointer;
}

.switch{
    text-align:center;
    margin-top:20px;
    color:#aaa;
}

.switch span{
    color:#00d4ff;
    cursor:pointer;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#aaa;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">GAMIN<span>X</span></div>

    <!-- LOGIN -->
    <div id="loginBox">
        <h2>Welcome Back</h2>

        <input type="text" id="loginUsername" placeholder="Username">

        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="login()">Login</button>

        <div class="switch">
            Don't have an account?
            <span onclick="showSignup()">Sign Up</span>
        </div>
    </div>


    <!-- SIGNUP -->
    <div id="signupBox" style="display:none;">
        <h2>Create Account</h2>

        <input type="text" id="signupUsername" placeholder="Choose Username">

        <input type="password" id="signupPassword" placeholder="Create Password">

        <button onclick="signup()">Create Account</button>

        <div class="switch">
            Already have an account?
            <span onclick="showLogin()">Login</span>
        </div>
    </div>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script>

function showSignup(){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("signupBox").style.display="block";
}

function showLogin(){
    document.getElementById("signupBox").style.display="none";
    document.getElementById("loginBox").style.display="block";
}

function signup(){

    const username = document.getElementById("signupUsername").value;
    const password = document.getElementById("signupPassword").value;

    if(username === "" || password === ""){
        alert("Please fill all fields");
        return;
    }

    localStorage.setItem("gaminxUsername", username);
    localStorage.setItem("gaminxPassword", password);

    alert("Account created successfully!");
    showLogin();
}

function login(){

    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;

    const savedUsername = localStorage.getItem("gaminxUsername");
    const savedPassword = localStorage.getItem("gaminxPassword");

    if(username === savedUsername && password === savedPassword){

        localStorage.setItem("gaminxLoggedIn", "true");

        alert("Login successful!");
        window.location.href="index.html";

    }else{
        alert("Invalid username or password");
    }
}

</script>

</body>
</html>
