<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile - GAMINX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0a0a0a;
    color:white;
    min-height:100vh;
}

nav{
    background:#111;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#00d4ff;
}

.back{
    background:#00d4ff;
    color:#000;
    text-decoration:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:50px auto;
    padding:0 20px;
}

.profile-card{
    background:#151515;
    border-radius:15px;
    padding:35px;
    text-align:center;
}

.avatar{
    width:100px;
    height:100px;
    background:#00d4ff;
    color:#000;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    margin:0 auto 20px;
}

.username{
    font-size:28px;
    margin-bottom:10px;
}

.bio{
    color:#aaa;
    margin-bottom:25px;
    line-height:1.6;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:25px 0;
}

.stat{
    background:#222;
    padding:15px 25px;
    border-radius:10px;
}

.stat h3{
    color:#00d4ff;
    font-size:22px;
}

.stat p{
    color:#999;
    font-size:13px;
}

.actions{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.edit-btn{
    background:#00d4ff;
    color:#000;
}

.logout-btn{
    background:#333;
    color:white;
}

.edit-area{
    display:none;
    margin-top:25px;
}

.edit-area textarea{
    width:100%;
    height:80px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    resize:none;
    margin-bottom:10px;
}
</style>
</head>

<body>

<nav>
    <div class="logo">GAMIN<span>X</span></div>
    <a href="index.html" class="back">← Home</a>
</nav>

<div class="container">

    <div class="profile-card">

        <div class="avatar" id="avatar">G</div>

        <h1 class="username" id="username">Gamer</h1>

        <p class="bio" id="bio">Gaming enthusiast 🎮</p>

        <div class="stats">

            <div class="stat">
                <h3 id="postCount">0</h3>
                <p>Posts</p>
            </div>

            <div class="stat">
                <h3 id="likeCount">0</h3>
                <p>Total Likes</p>
            </div>

        </div>

        <div class="actions">
            <button class="edit-btn" onclick="showEdit()">Edit Profile</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="edit-area" id="editArea">
            <textarea id="bioInput" placeholder="Write something about yourself..."></textarea>
            <button class="edit-btn" onclick="saveProfile()">Save Bio</button>
        </div>

    </div>

</div>

<script>

const loggedIn = localStorage.getItem("gaminxLoggedIn");

if(!loggedIn){
    alert("Please login first!");
    window.location.href = "login.html";
}

const username = localStorage.getItem("gaminxUsername") || "Gamer";
const bio = localStorage.getItem("gaminxBio") || "Gaming enthusiast 🎮";

document.getElementById("username").textContent = username;
document.getElementById("bio").textContent = bio;
document.getElementById("avatar").textContent = username.charAt(0).toUpperCase();

const posts = JSON.parse(localStorage.getItem("gaminxPosts")) || [];
const userPosts = posts.filter(post => post.username === username);

document.getElementById("postCount").textContent = userPosts.length;

const totalLikes = userPosts.reduce(
    (total, post) => total + post.likes,
    0
);

document.getElementById("likeCount").textContent = totalLikes;

function showEdit(){
    document.getElementById("editArea").style.display = "block";
    document.getElementById("bioInput").value =
        localStorage.getItem("gaminxBio") || "";
}

function saveProfile(){

    const newBio = document.getElementById("bioInput").value.trim();

    if(newBio !== ""){
        localStorage.setItem("gaminxBio", newBio);
        document.getElementById("bio").textContent = newBio;
    }

    document.getElementById("editArea").style.display = "none";
}

function logout(){

    localStorage.removeItem("gaminxLoggedIn");

    alert("Logged out successfully!");
    window.location.href = "index.html";
}

</script>

</body>
</html>
